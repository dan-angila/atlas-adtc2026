[workspace]
resolver = "2"
members = [
    "crates/atlas-domain",
    "crates/atlas-config",
    "crates/atlas-logging",
    "crates/atlas-ipc",
    "crates/atlas-engine",
    "crates/atlas-inference-worker",
    "crates/atlas-app",
]

# atlas-engine and atlas-domain are real dependencies of atlas-app as of
# the frontend/backend wiring work in docs/roadmap/development-roadmap.md
# Phase 6 — real ports and adapters (RagAnswerer, KnowledgeRepository,
# LanguageRegistry, the benchmark engine) exist now, so atlas-app, the
# composition root, wires concrete adapters to them
# (docs/architecture/module-boundaries.md).

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.97"
license = "Apache-2.0"
authors = ["BRIX Atlas Contributors"]
repository = "https://github.com/dan-angila/atlas-adtc2026"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-appender = "0.2"
uuid = { version = "1", features = ["v4", "serde"] }
directories = "5"
tempfile = "3"
sysinfo = "0.39"
sha2 = "0.11"
csv = "1"
pdf-extract = "0.12"

# Workspace-wide lint policy. Every member crate opts in via `[lints]
# workspace = true` — see docs/engineering-standards.md.
[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "unwind"
