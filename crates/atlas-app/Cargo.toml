[package]
name = "atlas-app"
description = "BRIX Atlas composition root: the Tauri desktop shell, wiring shared infrastructure (config, logging) and exposing commands to the front end."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true
build = "build.rs"

[lints]
workspace = true

[features]
# Not a default feature: the Tauri CLI enables this for `tauri build`
# (production bundles), while `cargo run -p atlas-app` / `cargo tauri dev`
# leave it off so the existing dev-server flow is unaffected. Without this
# feature declared, tauri::generate_context!()'s embedded `dev` flag
# (`cfg!(not(feature = "custom-protocol"))`) is unconditionally true for
# every build of this crate, including release/bundled ones, which makes
# even a packaged production binary try to load http://localhost:1420
# instead of the bundled frontendDist assets.
custom-protocol = ["tauri/custom-protocol"]

[lib]
name = "atlas_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "atlas-app"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
atlas-config = { path = "../atlas-config" }
atlas-logging = { path = "../atlas-logging" }
atlas-domain = { path = "../atlas-domain" }
atlas-engine = { path = "../atlas-engine" }
