[package]
name = "atlas-app"
description = "BRIX Atlas composition root: the Tauri desktop shell, wiring shared infrastructure (config, logging) and exposing commands to the front end."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true
build = "build.rs"

[lints]
workspace = true

[lib]
name = "atlas_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "atlas-app"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
atlas-config = { path = "../atlas-config" }
atlas-logging = { path = "../atlas-logging" }
