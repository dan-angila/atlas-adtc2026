[package]
name = "atlas-inference-worker"
description = "The llama.cpp FFI adapter, isolated in its own OS process per ADR-0010. Spawned and supervised by the Runtime Manager; never run standalone in production."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[[bin]]
name = "atlas-inference-worker"
path = "src/main.rs"

[dependencies]
atlas-ipc = { path = "../atlas-ipc" }
atlas-domain = { path = "../atlas-domain" }
atlas-logging = { path = "../atlas-logging" }
llama-cpp-2 = "0.1"
encoding_rs = "0.8"
rand = "0.8"
thiserror = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
