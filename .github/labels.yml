# Machine-readable label definitions for atlas-adtc2026.
# Human-readable rationale: docs/execution/github-labels.md
# Source of truth for a labels-sync GitHub Action (e.g.
# EndBug/label-sync or `gh label` scripting) once the repo is provisioned.

- name: "type:bug"
  color: "d73a4a"
  description: "Something behaves incorrectly relative to its documented/intended behavior"
- name: "type:feature"
  color: "0e8a16"
  description: "New capability"
- name: "type:refactor"
  color: "a2eeef"
  description: "Internal restructuring with no intended behavior change"
- name: "type:docs"
  color: "0075ca"
  description: "Documentation-only change"
- name: "type:test"
  color: "c5def5"
  description: "Test-only change"
- name: "type:chore"
  color: "cfd3d7"
  description: "Tooling, dependency bumps, CI config"
- name: "type:research"
  color: "5319e7"
  description: "Exploratory work in /research, not yet a committed decision"

- name: "area:ingestion"
  color: "fbca04"
  description: "Document Ingestion bounded context"
- name: "area:retrieval"
  color: "1d76db"
  description: "Knowledge Retrieval bounded context"
- name: "area:inference"
  color: "5319e7"
  description: "Inference & Generation bounded context"
- name: "area:conversation"
  color: "0e8a16"
  description: "Conversation & Session bounded context"
- name: "area:reporting"
  color: "e99695"
  description: "Reporting & Authoring bounded context"
- name: "area:ui"
  color: "bfd4f2"
  description: "Desktop shell / Tauri front end"
- name: "area:architecture"
  color: "d4c5f9"
  description: "Cross-cutting architecture, module boundaries"
- name: "area:ci-cd"
  color: "c2e0c6"
  description: "Build, CI, release tooling"

- name: "priority:critical"
  color: "b60205"
  description: "Blocks a milestone or breaks the offline/security guarantees"
- name: "priority:high"
  color: "d93f0b"
  description: "Should be resolved within the current milestone"
- name: "priority:medium"
  color: "fbca04"
  description: "Normal priority"
- name: "priority:low"
  color: "c2e0c6"
  description: "Nice to have, no urgency"

- name: "status:blocked"
  color: "000000"
  description: "Cannot proceed; blocking reason in a comment"
- name: "status:needs-design"
  color: "d4c5f9"
  description: "Needs a design note or ADR before implementation starts"
- name: "status:needs-benchmark"
  color: "d4c5f9"
  description: "Needs a /benchmarks or /evaluation entry before merge, per the Definition of Done"
- name: "status:in-review"
  color: "fef2c0"
  description: "PR open and awaiting review"

- name: "security"
  color: "ee0701"
  description: "Security-relevant; see SECURITY.md. Triggers mandatory maintainer review."
- name: "breaking-change"
  color: "e11d21"
  description: "Changes a public API, file format, or documented behavior in a backward-incompatible way"
- name: "adr"
  color: "1d76db"
  description: "Tracks or discusses an Architecture Decision Record"
- name: "good-first-issue"
  color: "7057ff"
  description: "Scoped, well-specified, suitable for a first-time contributor"
- name: "help-wanted"
  color: "008672"
  description: "Maintainers are actively looking for a contributor"
- name: "competition-critical"
  color: "b60205"
  description: "Required for Africa Deep Tech Challenge 2026 submission readiness"
- name: "wontfix"
  color: "ffffff"
  description: "Closed without action; reason required in a comment"
- name: "duplicate"
  color: "cfd3d7"
  description: "Duplicate of another issue; linked in a comment"
