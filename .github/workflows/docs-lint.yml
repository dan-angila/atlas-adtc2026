# Documentation CI gate: Markdown lint + broken relative-link check.
# Rust and frontend code have their own workflows (rust-ci.yml,
# frontend-ci.yml) — this one stays scoped to docs.

name: docs-lint

on:
  pull_request:
    paths:
      - "**/*.md"
  push:
    branches: [main]
    paths:
      - "**/*.md"

jobs:
  markdown-lint:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Lint Markdown
        uses: DavidAnson/markdownlint-cli2-action@v16
        with:
          globs: "**/*.md"

      - name: Check for broken relative links
        uses: gaurav-nelson/github-action-markdown-link-check@v1
        with:
          use-quiet-mode: "yes"
          check-modified-files-only: "yes"
          base-branch: "main"
          config-file: ".github/markdown-link-check-config.json"
