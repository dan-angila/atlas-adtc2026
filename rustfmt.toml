# rustfmt configuration. Deliberately close to defaults — this project's
# engineering standards treat `cargo fmt` as a non-negotiable CI gate, not
# a customization target; the fewer knobs turned, the less to disagree
# about in review.

edition = "2021"
max_width = 100
use_small_heuristics = "Default"
reorder_imports = true
newline_style = "Unix"
